plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diziverse.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.diziverse.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.4"
    }

    buildTypes {
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
